<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Security Awareness Training | Password Reset Simulation</title>
  <style>
    :root {
      --blue: #0078d4;
      --dark: #1b1b1b;
      --muted: #616161;
      --line: #e1e1e1;
      --bg: #f5f5f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--dark);
      font-family: "Segoe UI", SegoeUI, Arial, sans-serif;
    }

    .topbar {
      height: 56px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 32px;
      gap: 12px;
    }

    .squares {
      width: 22px;
      height: 22px;
      display: grid;
      grid-template-columns: repeat(2, 10px);
      grid-template-rows: repeat(2, 10px);
      gap: 2px;
    }

    .squares span:nth-child(1) { background: #f25022; }
    .squares span:nth-child(2) { background: #7fba00; }
    .squares span:nth-child(3) { background: #00a4ef; }
    .squares span:nth-child(4) { background: #ffb900; }

    .brand {
      font-size: 18px;
      font-weight: 600;
    }

    main {
      min-height: calc(100vh - 56px);
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 2px 7px rgba(0,0,0,.12);
      padding: 42px 44px;
    }

    .training-label {
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .03em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin: 0 0 16px;
    }

    p {
      font-size: 16px;
      line-height: 1.55;
      margin: 12px 0;
    }

    .notice {
      border-left: 4px solid var(--blue);
      background: #eef6fc;
      padding: 16px;
      margin: 24px 0;
    }

    .notice strong {
      display: block;
      margin-bottom: 6px;
    }

    ul {
      margin: 12px 0 24px;
      padding-left: 22px;
      line-height: 1.65;
    }

    .button {
      display: inline-block;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 11px 22px;
      border-radius: 2px;
    }

    .button:hover { background: #106ebe; }

    .small {
      color: var(--muted);
      font-size: 13px;
      margin-top: 28px;
    }

    .footer {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 0 16px 28px;
    }
  </style>
</head>
<body>
  <header class="topbar" aria-label="Training site header">
    <div class="squares" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="brand">Security Awareness Training</div>
  </header>

  <main>
